name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "응답 코드: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/studyroom_bookings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
